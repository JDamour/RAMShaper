[package]
name = "ramshaper-cli"
description = "RAMShaper read-only diagnostic CLI (first increment: info, low-memory-watch)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ramshaper-cli"
path = "src/main.rs"

[dependencies]
ramshaper-core = { workspace = true }
ramshaper-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
ramshaper-windows = { workspace = true }
ramshaper-agent = { workspace = true }

[dev-dependencies]
ramshaper-journal = { workspace = true }

[lints]
workspace = true
