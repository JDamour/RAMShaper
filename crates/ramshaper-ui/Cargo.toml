[package]
name = "ramshaper-ui"
description = "RAMShaper native UI feasibility shell (RS-010 spike: Overview driven by the session agent over IPC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "ramshaper-ui"
path = "src/main.rs"

[dependencies]
ramshaper-core = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
ramshaper-agent = { workspace = true }
ramshaper-windows = { workspace = true }
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }

[build-dependencies]
slint-build = "=1.18.1"

[lints]
workspace = true
